version: '3.8'

services:
  # 1. Proof-of-Origin (PO) Token Generator Service
  # Bypasses YouTube datacenter bot challenges as a verified guest without needing Google login
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: universal-pot-provider
    restart: always
    ports:
      - "4416:4416"
    environment:
      - PORT=4416
    networks:
      - universal-backend-net

  # 2. Universal Media Studio Zero-Disk Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: universal-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - POT_PROVIDER_URL=http://pot-provider:4416
      - FRONTEND_URL=https://humantalking.com
    depends_on:
      - pot-provider
    networks:
      - universal-backend-net

networks:
  universal-backend-net:
    driver: bridge
